services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./site:/usr/share/nginx/html:ro

  app:
    image: redis:7.4-alpine
    command: ["sh", "-c", "until redis-cli -h cache ping; do sleep 1; done; exec sleep 2147483647"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h cache ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  cache:
    image: redis:7.4-alpine
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cache_data:
